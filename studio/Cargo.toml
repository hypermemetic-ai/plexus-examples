[package]
name = "studio"
description = "An activation that holds others: the kiln in this process, the glaze activation in another, started as a child. Native only."
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false
default-run = "studio"

[features]
tls = ["plexus/tls", "dep:futures"]

[dependencies]
plexus = { path = "../../plexus", features = ["tokio"] }
kiln = { path = "../kiln" }
tokio = { version = "1", features = ["process"] }
futures = { version = "0.3", optional = true }

[dev-dependencies]
futures = "0.3"
glaze = { path = "../glaze" }
getrandom = "0.4"
plexus-ir = { path = "../../plexus-ir" }
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "process", "io-util", "time"] }

[[bin]]
name = "studio-kiln"
required-features = ["tls"]

[[test]]
name = "tls_kiln"
required-features = ["tls"]
