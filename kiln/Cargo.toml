[package]
name = "kiln"
description = "A toy service: a kiln and its firing log. Written with #[service]; its WIT is generated."
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
plexus = { path = "../../plexus" }
futures = "0.3"
wit-bindgen = { version = "0.63", features = ["async-spawn"] }
