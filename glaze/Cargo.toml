[package]
name = "glaze"
description = "A second toy activation: glaze recipes. Held by the studio beside the kiln. A component to wasm, a process natively."
edition = "2024"
version = "0.0.0"
license = "MIT"
publish = false

# A component to wasm (cdylib, built with --lib); natively, the `glaze` process.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plexus = { path = "../../plexus" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plexus = { path = "../../plexus", features = ["tokio"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
